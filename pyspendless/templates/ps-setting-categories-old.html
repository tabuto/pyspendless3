{% extends 'ps-nav.html' %}

{% block nav_content %}
<div class="container-fluid mt-4">
  <h1 class="mb-4">Gestione Categorie</h1>
  
  <!-- Alert per messaggi -->
  <div id="alertContainer"></div>
  
  <div class="card">
    <div class="card-header">
      <div class="d-flex justify-content-between align-items-center">
        <h3 class="card-title">Le tue Categorie</h3>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
          <i class="bi bi-plus-circle"></i> Aggiungi Categoria
        </button>
      </div>
    </div>
    <div class="card-body">
      <table class="table table-striped" id="categoriesTable">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Tipo</th>
            <th>Azioni</th>
          </tr>
        </thead>
        <tbody id="categoriesTableBody">
          <!-- Popolato dinamicamente -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal Aggiungi Categoria -->
<div class="modal fade" id="addCategoryModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Aggiungi Categoria</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="addCategoryForm">
          <div class="mb-3">
            <label for="categoryName" class="form-label">Nome</label>
            <input type="text" class="form-control" id="categoryName" required>
          </div>
          <div class="mb-3">
            <label for="categoryType" class="form-label">Tipo</label>
            <select class="form-select" id="categoryType" required>
              <option value="expense">Uscita</option>
              <option value="income">Entrata</option>
              <option value="transfer">Trasferimento</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
        <button type="button" class="btn btn-primary" onclick="addCategory()">Salva</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Modifica Categoria -->
<div class="modal fade" id="editCategoryModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Modifica Categoria</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="editCategoryForm">
          <input type="hidden" id="editCategoryId">
          <div class="mb-3">
            <label for="editCategoryName" class="form-label">Nome</label>
            <input type="text" class="form-control" id="editCategoryName" required>
          </div>
          <div class="mb-3">
            <label for="editCategoryType" class="form-label">Tipo</label>
            <select class="form-select" id="editCategoryType" required>
              <option value="expense">Uscita</option>
              <option value="income">Entrata</option>
              <option value="transfer">Trasferimento</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
        <button type="button" class="btn btn-primary" onclick="updateCategory()">Salva</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const accountId = {{ session.account_id }};

// Carica le categorie all'avvio
document.addEventListener('DOMContentLoaded', function() {
  loadCategories();
});

function showAlert(message, type = 'success') {
  const alertDiv = document.createElement('div');
  alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
  alertDiv.innerHTML = `
    ${message}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  `;
  document.getElementById('alertContainer').appendChild(alertDiv);
  
  setTimeout(() => {
    alertDiv.remove();
  }, 5000);
}

function loadCategories() {
  fetch('/api/categories')
    .then(response => response.json())
    .then(categories => {
      const tbody = document.getElementById('categoriesTableBody');
      tbody.innerHTML = '';
      
      categories.forEach(category => {
        const typeLabel = category.type === 'expense' ? 'Uscita' : 
                         category.type === 'income' ? 'Entrata' : 'Trasferimento';
        const typeBadge = category.type === 'expense' ? 'danger' : 
                         category.type === 'income' ? 'success' : 'info';
        
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${category.name}</td>
          <td><span class="badge bg-${typeBadge}">${typeLabel}</span></td>
          <td>
            <button class="btn btn-sm btn-warning" onclick="openEditModal(${category.id}, '${category.name}', '${category.type}')">
              <i class="bi bi-pencil"></i> Modifica
            </button>
            <button class="btn btn-sm btn-danger" onclick="deleteCategory(${category.id})">
              <i class="bi bi-trash"></i> Elimina
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });
    })
    .catch(error => {
      console.error('Errore:', error);
      showAlert('Errore durante il caricamento delle categorie', 'danger');
    });
}

function addCategory() {
  const name = document.getElementById('categoryName').value;
  const type = document.getElementById('categoryType').value;
  
  if (!name) {
    showAlert('Il nome è obbligatorio', 'warning');
    return;
  }
  
  fetch(`/api/accounts/${accountId}/categories`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ name, type })
  })
  .then(response => response.json())
  .then(data => {
    if (data.error) {
      showAlert(data.error, 'danger');
    } else {
      showAlert('Categoria creata con successo', 'success');
      loadCategories();
      document.getElementById('addCategoryForm').reset();
      bootstrap.Modal.getInstance(document.getElementById('addCategoryModal')).hide();
    }
  })
  .catch(error => {
    console.error('Errore:', error);
    showAlert('Errore durante la creazione della categoria', 'danger');
  });
}

function openEditModal(id, name, type) {
  document.getElementById('editCategoryId').value = id;
  document.getElementById('editCategoryName').value = name;
  document.getElementById('editCategoryType').value = type;
  
  const modal = new bootstrap.Modal(document.getElementById('editCategoryModal'));
  modal.show();
}

function updateCategory() {
  const id = document.getElementById('editCategoryId').value;
  const name = document.getElementById('editCategoryName').value;
  const type = document.getElementById('editCategoryType').value;
  
  fetch(`/api/categories/${id}`, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ name, type })
  })
  .then(response => response.json())
  .then(data => {
    if (data.error) {
      showAlert(data.error, 'danger');
    } else {
      showAlert('Categoria aggiornata con successo', 'success');
      loadCategories();
      bootstrap.Modal.getInstance(document.getElementById('editCategoryModal')).hide();
    }
  })
  .catch(error => {
    console.error('Errore:', error);
    showAlert('Errore durante l\'aggiornamento della categoria', 'danger');
  });
}

function deleteCategory(id) {
  if (!confirm('Sei sicuro di voler eliminare questa categoria?')) {
    return;
  }
  
  fetch(`/api/categories/${id}`, {
    method: 'DELETE'
  })
  .then(response => response.json())
  .then(data => {
    if (data.error) {
      showAlert(data.error, 'danger');
    } else {
      showAlert('Categoria eliminata con successo', 'success');
      loadCategories();
    }
  })
  .catch(error => {
    console.error('Errore:', error);
    showAlert('Errore durante l\'eliminazione della categoria', 'danger');
  });
}
</script>
{% endblock %}
