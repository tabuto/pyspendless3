{% extends 'ps-base.html' %}

{% block content %}
<div class="app-wrapper">
  <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
    <!--begin::Sidebar Brand-->
    <div class="sidebar-brand">
      <a href="{{ url_for('home') }}" class="brand-link">
        <i class="bi bi-wallet2 brand-image opacity-75" style="font-size: 2rem;"></i>
        <span class="brand-text fw-light">PySpendless</span>
      </a>
    </div>
    <div class="sidebar-wrapper">
      <nav class="mt-2">
        <!--begin::Sidebar Menu-->
        <ul class="nav sidebar-menu flex-column" role="navigation" aria-label="Main navigation" id="navigation">
          <li class="nav-item">
            <a href="{{ url_for('home') }}" class="nav-link">
              <i class="nav-icon bi bi-house-door"></i>
              <p>Home</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="{{ url_for('create') }}" class="nav-link">
              <i class="nav-icon bi bi-plus-circle"></i>
              <p>Crea Movimento</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="{{ url_for('movements') }}" class="nav-link">
              <i class="nav-icon bi bi-list-ul"></i>
              <p>Visualizza Movimenti</p>
            </a>
          </li>
          <li class="nav-item">
            <button type="button" class="nav-link w-100 text-start border-0 bg-transparent" onclick="toggleSettingsMenu(event)">
              <i class="nav-icon bi bi-gear"></i>
              <p>
                Impostazioni
                <i class="nav-arrow bi bi-chevron-right"></i>
              </p>
            </button>
            <ul class="nav nav-treeview" id="settingsSubmenu" style="display: none;">
              <li class="nav-item">
                <a href="{{ url_for('settings_categories') }}" class="nav-link">
                  <i class="nav-icon bi bi-tag"></i>
                  <p>Categorie</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="{{ url_for('settings_wallets') }}" class="nav-link">
                  <i class="nav-icon bi bi-wallet"></i>
                  <p>Wallet</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="{{ url_for('settings_group') }}" class="nav-link">
                  <i class="nav-icon bi bi-people"></i>
                  <p>Gruppo</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="{{ url_for('settings_import_export') }}" class="nav-link">
                  <i class="nav-icon bi bi-arrow-down-up"></i>
                  <p>Import/Export</p>
                </a>
              </li>
            </ul>
          </li>
          <li class="nav-item mt-3">
            <a href="{{ url_for('logout') }}" class="nav-link text-danger">
              <i class="nav-icon bi bi-box-arrow-right"></i>
              <p>Logout</p>
            </a>
          </li>
        </ul>
        <!--end::Sidebar Menu-->
      </nav>
    </div>
  </aside>
  <main class="app-main">
    {% block nav_content %}{% endblock %}
  </main>
</div>

<script>
function toggleSettingsMenu(event) {
  event.preventDefault();
  event.stopPropagation();
  
  const submenu = document.getElementById('settingsSubmenu');
  const arrow = event.currentTarget.querySelector('.nav-arrow');
  const parentLi = event.currentTarget.parentElement;
  
  if (submenu.style.display === 'none' || submenu.style.display === '') {
    submenu.style.display = 'block';
    arrow.classList.remove('bi-chevron-right');
    arrow.classList.add('bi-chevron-down');
    parentLi.classList.add('menu-open');
  } else {
    submenu.style.display = 'none';
    arrow.classList.remove('bi-chevron-down');
    arrow.classList.add('bi-chevron-right');
    parentLi.classList.remove('menu-open');
  }
  
  return false;
}
</script>
{% endblock %}
